[package]
name = "ledger-client"
version = "0.1.0"
edition = "2021"
description = "ledger.ohmygh.com standard client (REQ-063): signed add-only faces for issue + artifact; close/delete belong to omc workbench"
license = "Apache-2.0"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
